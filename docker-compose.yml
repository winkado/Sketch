# One container per bot account. Each holds up to CONCURRENT battles at once (one pending search at a time is the server's rule).
# Add more services (bot2, bot3...) with their own PS_USER/PS_PASS for more accounts; keep it to 3-4 per IP.
x-bot: &bot
  build: .
  restart: unless-stopped
  stop_grace_period: 30m     # docker stop -> SIGTERM -> bot finishes open battles instead of forfeiting
  volumes:
    - ./replays/own:/app/replays/own
    - ./manager:/app/manager          # A/B state, assignment, hand-written challengers in manager/queue/
    - ./models:/app/models            # behaviour.json / sets.json refreshed from own games
    - ./:/app/teams_out               # generated team_chal_*.json land in /app; copied here by the manager
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  bot1:
    <<: *bot
    container_name: sketch-bot1
    environment:
      PS_USER: ${PS_USER_1}
      PS_PASS: ${PS_PASS_1}
      TEAM: team_trickroom_v8.json
      MANAGER: "1"             # champion/challenger A/B + model refresh, unattended
      INCUMBENT: team_trickroom_v8.json
      SPRT_DELTA: "0.05"
      SPRT_MIN: "60"
      SPRT_MAX: "400"
      REFRESH_GAMES: "50"
      GAMES: "300"
      CONCURRENT: "2"          # M4: ~3-4 s/decision; two battles stay well inside the 45 s timer
      SEARCH: "1"              # expectimax over the rebuilt battle; "0" = plan rules
      M: "8"
      K: "4"
      ROLL: "8"
      VERBOSE: "1"             # logs every decision: turn, path (search/rules), milliseconds, choice
